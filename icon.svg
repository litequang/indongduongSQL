<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Golden Orange Bag Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bag Shadow/Depth Gradient -->
    <linearGradient id="bagFoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4" />
    </linearGradient>

    <!-- Flexo Cylinder Metallic Gradient -->
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Flexo Cyan / Magenta / Yellow / Black Inks -->
    <linearGradient id="cyanInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="magentaInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="yellowInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Background Frame (Rounded squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Rim -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="3" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="240" r="150" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />
  <circle cx="360" cy="180" r="80" fill="#0284c7" opacity="0.12" filter="url(#glow)" />

  <g filter="url(#shadowFilter)">
    <!-- 1. The Paper Bread Bag (Túi Giấy Bánh Mì) Base Structure -->
    <!-- Bag Body -->
    <path d="M 130 180 
             L 382 180 
             L 362 430 
             Q 360 442 346 442 
             L 166 442 
             Q 152 442 150 430 
             Z" 
          fill="url(#bagGrad)" />

    <!-- Bag Side Gusset Fold Shadow (Nếp gấp hông túi) -->
    <path d="M 130 180 
             L 185 240 
             L 170 442 
             L 150 430 
             Z" 
          fill="url(#bagFoldGrad)" />

    <path d="M 382 180 
             L 327 240 
             L 342 442 
             L 362 430 
             Z" 
          fill="url(#bagFoldGrad)" opacity="0.5" />

    <!-- Bag Top Serrated / Folded Edge (Răng cưa miệng túi giấy) -->
    <path d="M 130 180 
             L 151 162 L 172 180 L 193 162 L 214 180 L 235 162 
             L 256 180 L 277 162 L 298 180 L 319 162 L 340 180 
             L 361 162 L 382 180 
             L 382 195 L 130 195 Z" 
          fill="#fef3c7" />

    <!-- Bag Center Fold Line (Đường sống giữa túi giấy) -->
    <line x1="256" y1="180" x2="256" y2="442" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7" />

    <!-- 2. Bag Print Graphic: French Bread Bag / Bakery Motif on Bag -->
    <g transform="translate(0, 20)">
      <!-- Bread Outline / Loaf -->
      <path d="M 200 310 
               C 195 285, 230 270, 256 270 
               C 282 270, 317 285, 312 310 
               C 310 330, 280 340, 256 340 
               C 232 340, 202 330, 200 310 Z" 
            fill="#78350f" opacity="0.9" />
      
      <!-- Bread Cuts / Slits (Vết khía bánh mì) -->
      <path d="M 224 290 Q 232 300 228 315" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
      <path d="M 252 286 Q 260 300 256 318" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
      <path d="M 280 290 Q 288 300 284 315" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />

      <!-- Typography Subtext on Bag -->
      <rect x="210" y="356" width="92" height="7" rx="3.5" fill="#78350f" opacity="0.85" />
      <rect x="226" y="369" width="60" height="5" rx="2.5" fill="#78350f" opacity="0.65" />
    </g>

    <!-- 3. Flexo Printing Cylinder / Roller (Trục In Flexo Công Nghiệp) -->
    <g id="flexoCylinder">
      <!-- Axis Shaft Left & Right -->
      <rect x="70" y="106" width="372" height="16" rx="8" fill="#475569" stroke="#1e293b" stroke-width="2" />
      
      <!-- Main Cylinder Roller Body -->
      <rect x="106" y="86" width="300" height="56" rx="14" fill="url(#cylinderGrad)" stroke="#334155" stroke-width="3" />
      
      <!-- Roller Steel Ribs / Precision Engraving lines (Trục Anilox / Flexo) -->
      <line x1="130" y1="88" x2="130" y2="140" stroke="#64748b" stroke-width="2" />
      <line x1="160" y1="88" x2="160" y2="140" stroke="#64748b" stroke-width="2" />
      <line x1="220" y1="88" x2="220" y2="140" stroke="#64748b" stroke-width="2" />
      <line x1="256" y1="88" x2="256" y2="140" stroke="#cbd5e1" stroke-width="3" />
      <line x1="292" y1="88" x2="292" y2="140" stroke="#64748b" stroke-width="2" />
      <line x1="352" y1="88" x2="352" y2="140" stroke="#64748b" stroke-width="2" />
      <line x1="382" y1="88" x2="382" y2="140" stroke="#64748b" stroke-width="2" />

      <!-- High-gloss Light Reflection on Roller -->
      <rect x="112" y="94" width="288" height="8" rx="4" fill="#ffffff" opacity="0.65" />

      <!-- Flexo Ink Flow / Laser Photopolymer Plate Wrap (Bản in cao su / Polymer) -->
      <rect x="190" y="88" width="132" height="52" rx="6" fill="#0284c7" opacity="0.3" />
    </g>

    <!-- 4. CMYK Process Ink Registration Dots & Precision Crosshairs (Mắt Kẽm & Hạt Màu In) -->
    <!-- Cyan Dot -->
    <circle cx="160" cy="156" r="14" fill="url(#cyanInk)" stroke="#ffffff" stroke-width="2" />
    <!-- Magenta Dot -->
    <circle cx="224" cy="156" r="14" fill="url(#magentaInk)" stroke="#ffffff" stroke-width="2" />
    <!-- Yellow Dot -->
    <circle cx="288" cy="156" r="14" fill="url(#yellowInk)" stroke="#ffffff" stroke-width="2" />
    <!-- Key/Black Dot -->
    <circle cx="352" cy="156" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2" />

    <!-- Print Register Target Mark (Dấu Chữ Thập Kẽm In Flexo) -->
    <g transform="translate(424, 250)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="3" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#f43f5e" stroke-width="2" />
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#fde047" />
    </g>

    <g transform="translate(88, 250)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#fbbf24" stroke-width="3" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#fbbf24" stroke-width="2" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#fbbf24" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#f43f5e" />
    </g>
  </g>

  <!-- Dynamic Flexo Ink Waves / Speed Streamline -->
  <path d="M 120 468 Q 256 484 392 468" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 160 482 Q 256 494 352 482" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
